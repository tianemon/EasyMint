<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EM Detail</title>
  <style>
    :root {
      --bg: #fafafa; --surface: #ffffff; --fg: #111111; --muted: #666666;
      --border: #e5e5e5; --accent: #2563eb; --accent-hover: #1d4ed8;
      --danger: #dc2626; --success: #16a34a;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem;
      --text-xl: 1.25rem; --text-2xl: 1.5rem;
      --leading-tight: 1.2; --leading-normal: 1.5;
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;
      --radius-sm: 6px; --radius-md: 10px; --radius-full: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); font-size: var(--text-base); color: var(--fg); background: var(--bg); }
    h1 { font-size: var(--text-2xl); font-weight: 700; line-height: var(--leading-tight); }
    h2 { font-size: var(--text-xl); font-weight: 700; }
    p { color: var(--muted); line-height: var(--leading-normal); }

    /* Nav */
    .nav { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px solid var(--border); }
    .nav-back { font-size: var(--text-sm); color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: var(--space-1); }
    .nav-back:hover { color: var(--fg); }
    .container { width: min(960px, 92vw); margin: 0 auto; padding: 0 var(--space-4); }

    /* Layout */
    .detail-layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-8); padding: var(--space-8) 0; }
    @media (max-width: 768px) { .detail-layout { grid-template-columns: 1fr; } }

    /* Media */
    .media-area { background: var(--border); border-radius: var(--radius-md); aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: var(--text-sm); margin-bottom: var(--space-6); }

    /* Info */
    .info-section { margin-bottom: var(--space-6); }
    .info-label { font-size: var(--text-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-2); }
    .info-text { font-size: var(--text-sm); }

    /* Sidebar card */
    .side-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-6); position: sticky; top: var(--space-4); }
    .side-price { font-size: var(--text-2xl); font-weight: 800; margin-bottom: var(--space-1); }
    .side-meta { font-size: var(--text-sm); color: var(--muted); margin-bottom: var(--space-6); }
    .side-list { list-style: none; margin-bottom: var(--space-6); }
    .side-list li { padding: var(--space-2) 0; font-size: var(--text-sm); border-bottom: 1px solid var(--border); }
    .side-list li:last-child { border-bottom: none; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border: none; border-radius: var(--radius-sm); font-family: var(--font); font-size: var(--text-sm); font-weight: 600; cursor: pointer; transition: all 0.15s ease; width: 100%; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #fff; margin-bottom: var(--space-2); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-danger { background: var(--danger); color: #fff; }
  </style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="#" class="nav-back">← 返回</a>
    <span style="flex:1"></span>
    <button class="btn btn-secondary" style="width:auto;padding:8px 16px;">编辑</button>
  </nav>
</div>

<div class="container detail-layout">
  <!-- Main content -->
  <div>
    <div class="media-area">[图片/视频/轮播]</div>
    <h1 class="mb-4">产品/文章标题</h1>
    <p class="mb-6">详细描述文字。这里可以放多段内容，说明产品的特点、功能、使用场景等。</p>
    <div class="info-section">
      <div class="info-label">详细信息</div>
      <div class="info-text">规格、参数、标签等具体数据放在这里。</div>
    </div>
  </div>

  <!-- Sidebar -->
  <aside>
    <div class="side-card">
      <div class="side-price">$99</div>
      <div class="side-meta">含税价格 / 一次性付款</div>
      <ul class="side-list">
        <li>✓ 功能 A</li>
        <li>✓ 功能 B</li>
        <li>✓ 功能 C</li>
      </ul>
      <button class="btn btn-primary">立即购买</button>
      <button class="btn btn-secondary">加入购物车</button>
    </div>
  </aside>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EM Form</title>
  <style>
    :root {
      --bg: #fafafa; --surface: #ffffff; --fg: #111111; --muted: #666666;
      --border: #e5e5e5; --accent: #2563eb; --accent-hover: #1d4ed8;
      --danger: #dc2626; --success: #16a34a;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem; --text-xl: 1.25rem;
      --leading-tight: 1.2; --leading-normal: 1.5;
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;
      --radius-sm: 6px; --radius-md: 10px; --radius-full: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); font-size: var(--text-base); color: var(--fg); background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-8); width: 100%; max-width: 480px; box-shadow: var(--shadow-sm); }
    .form-title { font-size: var(--text-xl); font-weight: 700; margin-bottom: var(--space-2); }
    .form-desc { font-size: var(--text-sm); color: var(--muted); margin-bottom: var(--space-6); }
    .form-group { margin-bottom: var(--space-4); }
    .form-label { display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-1); }
    .form-label .required { color: var(--danger); }
    .form-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font); font-size: var(--text-sm); color: var(--fg); background: var(--surface); transition: border-color 0.15s, box-shadow 0.15s; }
    .form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .form-input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
    .form-input:disabled { background: var(--bg); color: var(--muted); cursor: not-allowed; }
    .form-error { font-size: var(--text-xs); color: var(--danger); margin-top: var(--space-1); }
    .form-hint { font-size: var(--text-xs); color: var(--muted); margin-top: var(--space-1); }
    .form-check { display: flex; align-items: flex-start; gap: var(--space-2); margin-bottom: var(--space-4); }
    .form-check input { margin-top: 3px; }
    .form-check label { font-size: var(--text-sm); color: var(--muted); }
    .form-actions { display: flex; gap: var(--space-3); margin-top: var(--space-6); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border: none; border-radius: var(--radius-sm); font-family: var(--font); font-size: var(--text-sm); font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }

    @media (max-width: 520px) {
      .form-card { max-width: 100%; padding: var(--space-4); border-radius: 0; border: none; }
    }
  </style>
</head>
<body>
<div class="form-card">
  <h1 class="form-title">表单标题</h1>
  <p class="form-desc">简要说明此表单的用途和需要填写的信息。</p>

  <div class="form-group">
    <label class="form-label">姓名 <span class="required">*</span></label>
    <input class="form-input" type="text" placeholder="请输入姓名" />
    <!-- <p class="form-error">姓名不能为空</p> -->
  </div>

  <div class="form-group">
    <label class="form-label">邮箱 <span class="required">*</span></label>
    <input class="form-input" type="email" placeholder="you@example.com" />
    <p class="form-hint">我们会向此邮箱发送确认邮件。</p>
  </div>

  <div class="form-group">
    <label class="form-label">密码 <span class="required">*</span></label>
    <input class="form-input" type="password" placeholder="至少 8 位字符" />
  </div>

  <div class="form-group">
    <label class="form-label">角色</label>
    <select class="form-input">
      <option>开发者</option>
      <option>设计师</option>
      <option>产品经理</option>
    </select>
  </div>

  <div class="form-check">
    <input type="checkbox" id="terms" />
    <label for="terms">我同意<a href="#">服务条款</a>和<a href="#">隐私政策</a></label>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary">提交</button>
    <button class="btn btn-secondary">取消</button>
  </div>
</div>
</body>
</html>

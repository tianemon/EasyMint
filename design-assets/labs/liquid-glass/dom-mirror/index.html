<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6eeed"><title>DOM 镜像 · 液态玻璃长列表</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#253734;background:#e6eeed}button,input{font:inherit}button{cursor:pointer}.scene{background:radial-gradient(ellipse at 12% 24%,#a6d5bd99,transparent 48%),radial-gradient(ellipse at 90% 75%,#9cb7e3aa,transparent 50%),#e6eeed}.scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.content{max-width:720px;margin:auto;padding:205px 22px 240px}.intro{margin:0 0 30px}.intro h1{font-size:32px;letter-spacing:-1px;margin:8px 0}.intro p{font-size:14px;color:#637571;line-height:1.7}.eyebrow{font-size:11px;letter-spacing:2px;color:#508777}.row{padding:20px 0;border-bottom:1px solid #708f811f;display:flex;gap:13px;align-items:flex-start}.avatar{flex:none;width:35px;height:35px;border-radius:12px;background:#3d7567;color:white;display:grid;place-items:center;font-size:12px}.row:nth-child(3n) .avatar{background:#6589a8}.body{min-width:0;flex:1}.meta{font-size:11px;color:#74827f;margin:1px 0 8px}.text{font-size:15px;line-height:1.8;margin:0;overflow-wrap:anywhere}.art{margin-top:13px;border-radius:18px;height:120px;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#ffffff55 0 1px,transparent 1px 32px),linear-gradient(125deg,#527fbe,#c3d6df 45%,#89b894)}.art:before{content:'';position:absolute;width:90px;height:90px;border:13px solid #ffe6a8;border-radius:50%;left:18%;top:16px}.art:after{content:'';position:absolute;right:12%;top:32px;width:95px;height:55px;background:#ee8a84;transform:rotate(-18deg);border-radius:10px}.code{background:#29443d;color:#d5e9df;border-radius:12px;padding:12px;font:12px/1.7 ui-monospace,monospace;margin-top:12px}.header{position:absolute;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 20px 12px;background:#e6eeedf0;z-index:3;border-bottom:1px solid #617c7420}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:680px;margin:auto}.bar strong{font-size:14px}.bar span{font-size:11px;color:#657d75}.controls{flex-wrap:wrap;max-width:680px;margin:12px auto 0;display:flex;align-items:center;gap:10px;font-size:12px}details{max-width:680px;margin:10px auto 0;font-size:12px}summary{cursor:pointer;color:#668c7c}.controls select{font:inherit;max-width:190px;border-radius:10px;padding:5px}.controls input{width:110px;accent-color:#36735d}.controls button{border:1px solid #718f8233;border-radius:20px;padding:6px 10px;background:#fff8;color:inherit;font-size:12px}.controls output{min-width:28px}.dock{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),660px);height:126px;z-index:4;border-radius:32px;isolation:isolate;box-shadow:3px 8px 22px #1f3d3024}.lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;contain:strict}.optics{position:absolute;inset:-48px;filter:url(#liquid);overflow:hidden}.mirror-scene{position:absolute;left:0;top:0;will-change:transform}.mirror-content{position:absolute;top:0;left:0;right:0}.skin{position:absolute;inset:0;border-radius:inherit;background:transparent;pointer-events:none}.edge-contour{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.front{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:space-between}.placeholder{font-size:16px;color:#29483f}.actions{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#365349}.send{border:1px solid #fff7;background:#fff6;border-radius:50%;width:32px;height:32px;color:#29483f;font-size:20px}.dock.plain .optics{filter:none}svg.defs{position:absolute;width:0;height:0}button:active{transform:scale(.96)}
@media(prefers-color-scheme:dark){html,body{color:#dbe8e2;background:#1c292b}.scene{background:radial-gradient(ellipse at 12% 24%,#3d756855,transparent 48%),radial-gradient(ellipse at 90% 75%,#42567d88,transparent 50%),#1c292b}.header{background:#1c292bf0}.intro p,.bar span,.meta{color:#a0b3ad}.controls button{background:#344740}.placeholder,.actions,.send{color:#d8ebe2}.skin{background:#0000000d}.send{background:#718e7b44}.code{background:#102820}}
</style></head><body>
<svg class="defs" aria-hidden="true"><defs><filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"></filter></defs></svg>
<div class="scroll scene" id="scroll"><main class="content" id="content"><div class="intro"><div class="eyebrow">LIVE DOM MIRROR / 01</div><h1>让内容流过玻璃。</h1><p>160 条长列表，文字、圆环和图片色块穿过底部输入卡。没有截图缓存，滚动时同步镜像位置。试试快速滑动、慢慢观察圆环经过边缘的变化。</p></div><div id="rows"></div></main></div>
<header class="header"><div class="bar"><strong>DOM 镜像 · 长列表</strong><span id="status">实时同步</span></div><div class="controls"><label for="strength">折射倍率</label><input id="strength" type="range" min="0" max="2" step="0.05" value="1"><output id="value">1×</output><button id="mode">液态玻璃</button><button id="auto">自动滚动</button></div><div class="controls"><label for="edgeWidth">边线粗细</label><input id="edgeWidth" type="range" min="0" max="2" step="0.1" value="0.5"><output id="edgeWidthValue">0.5px</output><label for="edgeRetreat">白边退让</label><input id="edgeRetreat" type="range" min="0" max="8" step="0.5" value="2"><output id="edgeRetreatValue">2px</output></div><details><summary>折射细节</summary><div class="controls" id="opticalControls"></div></details></header>
<div class="dock" id="dock"><div class="lens" aria-hidden="true" inert><div class="optics" id="optics"><div class="mirror-scene scene" id="mirrorScene"><div class="mirror-content" id="mirrorContent"></div></div></div></div><div class="skin"><canvas class="edge-contour" id="edgeContour"></canvas></div><div class="front"><div class="placeholder">观察文字和圆环经过边缘…</div><div class="actions"><span>镜像内容不可交互 · 前景独立绘制</span><button class="send" aria-label="返回列表顶部" id="top">↑</button></div></div></div>
<script type="module" src="./lab.mjs"></script></body></html>

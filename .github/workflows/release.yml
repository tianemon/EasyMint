name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-notes:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract changelog for tag
        id: extract
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # v0.6.1 → 0.6.1（CHANGELOG 标题兼容两种格式:## v0.6.1 与 ## [v0.6.1]。
          # 字面 [ 用字符类 [[] 匹配——POSIX 写法,BSD/GNU awk 均支持）
          VERSION="${TAG#v}"
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## v" v " " || $0 ~ "^## [[]v" v "[]] " { found=1; next }
            found && ($0 ~ "^## v" || $0 ~ "^## [[]v") { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare-notes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 项目 .npmrc 指向 npmmirror(国内本地安装加速),CI runner 在海外——环境变量覆盖回官方源
      - run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run build:ci

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.prepare-notes.outputs.notes }}
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac.yml

  build-windows:
    needs: prepare-notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 项目 .npmrc 指向 npmmirror(国内本地安装加速),CI runner 在海外——环境变量覆盖回官方源
      - run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run build:ci

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.prepare-notes.outputs.notes }}
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml

  build-linux:
    needs: prepare-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 项目 .npmrc 指向 npmmirror(国内本地安装加速),CI runner 在海外——环境变量覆盖回官方源
      - run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run build:ci

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.prepare-notes.outputs.notes }}
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.tar.gz
            dist-electron/*.blockmap
            dist-electron/latest-linux.yml


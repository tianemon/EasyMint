name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-notes:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract changelog for tag
        id: extract
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # v0.6.1 → 0.6.1（CHANGELOG 标题兼容两种格式:## v0.6.1 与 ## [v0.6.1]。
          # 字面 [ 用字符类 [[] 匹配——POSIX 写法,BSD/GNU awk 均支持）
          VERSION="${TAG#v}"
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## v" v " " || $0 ~ "^## [[]v" v "[]] " { found=1; next }
            found && ($0 ~ "^## v" || $0 ~ "^## [[]v") { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::Missing changelog for $TAG"
            exit 1
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 项目 .npmrc 指向 npmmirror(国内本地安装加速),CI runner 在海外——环境变量覆盖回官方源
      - run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

      - name: Install mobile Web dependencies
        run: npm ci --prefix resources/em-mobile-web
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        # 未购买 Developer ID 证书时的分发签名：显式 ad-hoc。若不指定，electron-builder 在无证书的
        # runner 上会直接跳过签名，产物没有 _CodeSignature，下载后 Gatekeeper 报「已损坏」（无法绕过）。
        # 将来配了证书：删掉本行参数与上面的 CSC_IDENTITY_AUTO_DISCOVERY，改走正式签名 + 公证。
        run: npm run build:ci -- -c.mac.identity=-

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          compression-level: 0
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 项目 .npmrc 指向 npmmirror(国内本地安装加速),CI runner 在海外——环境变量覆盖回官方源
      - run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

      - name: Install mobile Web dependencies
        run: npm ci --prefix resources/em-mobile-web
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run build:ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          compression-level: 0
          path: |
            dist-electron/*.exe
            dist-electron/*-windows-*.zip
            dist-electron/*.blockmap
            dist-electron/latest.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 项目 .npmrc 指向 npmmirror(国内本地安装加速),CI runner 在海外——环境变量覆盖回官方源
      - run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/

      - name: Install mobile Web dependencies
        run: npm ci --prefix resources/em-mobile-web
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm run build:ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          compression-level: 0
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.tar.gz
            dist-electron/*.blockmap
            dist-electron/latest-linux.yml

  publish:
    needs: [prepare-notes, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-electron

      - name: Verify installers and update manifests
        shell: bash
        run: |
          set -euo pipefail
          cd dist-electron
          shopt -s nullglob
          for pattern in '*.dmg' '*-macOS-*.zip' '*.exe' '*-windows-*.zip' '*.AppImage' '*.deb' '*.tar.gz' '*.dmg.blockmap' '*.zip.blockmap' '*.exe.blockmap'; do
            files=( $pattern )
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::Missing release file matching $pattern"
              exit 1
            fi
          done
          for manifest in latest-mac.yml latest.yml latest-linux.yml; do
            version=$(awk '$1 == "version:" { print $2; exit }' "$manifest")
            if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
              echo "::error::$manifest version '$version' does not match $GITHUB_REF_NAME"
              exit 1
            fi
            asset=$(awk '$1 == "path:" { print $2; exit }' "$manifest")
            if [ -z "$asset" ] || [ "$asset" != "${asset##*/}" ] || [ ! -s "$asset" ]; then
              echo "::error::$manifest references a missing release asset '$asset'"
              exit 1
            fi
          done

      - name: Upload release draft
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ needs.prepare-notes.outputs.notes }}
          files: dist-electron/*
          fail_on_unmatched_files: true
          draft: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

